name: EINSTEIN REMOTE

on:
  push:
    branches: ["**"]   # tags de versão vão para o workflow de release
    paths:
      - "einstein-remote/**"
      - ".github/workflows/einstein-remote.yml"
  pull_request:
    paths:
      - "einstein-remote/**"
  workflow_dispatch:
  workflow_call:       # reutilizado pelo workflow de release

permissions:
  contents: read

jobs:
  tests:
    name: Testes (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    defaults:
      run:
        working-directory: einstein-remote
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Dependências
        run: python -m pip install -r requirements-dev.txt
      - name: Testes (Linux, com tela virtual para a janela de pareamento)
        if: runner.os == 'Linux'
        run: xvfb-run -a python -m pytest -q
      - name: Testes (Windows — DPAPI, registro, Tk e bandeja reais)
        if: runner.os == 'Windows'
        run: python -m pytest -q

  docker:
    name: Servidor em produção (Docker + HTTPS)
    needs: tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: einstein-remote
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Dependências do agente (cliente real para o teste)
        run: python -m pip install ./agent
      - name: docker compose (servidor + Caddy) com agente real via wss://
        run: bash deploy/smoke_compose.sh

  windows-exe:
    name: Executável e instalador Windows
    needs: tests
    runs-on: windows-latest
    timeout-minutes: 40
    env:
      HAS_CERT: ${{ secrets.WINDOWS_CERT_PFX_BASE64 != '' }}
    defaults:
      run:
        working-directory: einstein-remote
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Inno Setup 6
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { choco install innosetup -y --no-progress; if ($LASTEXITCODE -ne 0) { throw "choco falhou" } }
          if (-not (Test-Path $iscc)) { throw "ISCC.exe não encontrado" }
          "EINSTEIN_ISCC=$iscc" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
      - name: Certificado de assinatura (somente se configurado nos segredos)
        if: env.HAS_CERT == 'true'
        shell: pwsh
        env:
          PFX: ${{ secrets.WINDOWS_CERT_PFX_BASE64 }}
        run: |
          $path = Join-Path $env:RUNNER_TEMP "sign.pfx"
          [IO.File]::WriteAllBytes($path, [Convert]::FromBase64String($env:PFX))
          "EINSTEIN_SIGN_PFX=$path" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
      - name: Build (PyInstaller + Inno Setup)
        shell: pwsh
        env:
          EINSTEIN_PYTHON: python
          EINSTEIN_SIGN_PASSWORD: ${{ secrets.WINDOWS_CERT_PASSWORD }}
        run: ./installer/build-agent.ps1
      - name: Smoke test dos executáveis contra um servidor real
        run: |
          python -m pip install -r server/requirements.txt
          python installer/smoke_exe.py dist/EinsteinRemoteAgent
      - name: Instalador — instalar, vincular, atualizar com o agente aberto, desinstalar
        shell: pwsh
        run: |
          $setup = Get-ChildItem dist\EinsteinRemoteAgent-*-Setup.exe | Select-Object -First 1
          python installer/smoke_setup.py $setup.FullName
      - name: Remover certificado
        if: always() && env.HAS_CERT == 'true'
        shell: pwsh
        run: Remove-Item -Force (Join-Path $env:RUNNER_TEMP "sign.pfx") -ErrorAction SilentlyContinue
      - uses: actions/upload-artifact@v4
        with:
          name: EinsteinRemoteAgent-win64
          path: |
            einstein-remote/dist/*.zip
            einstein-remote/dist/*-Setup.exe
          if-no-files-found: error
