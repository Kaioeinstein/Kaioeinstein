name: EINSTEIN REMOTE

on:
  push:
    paths:
      - "einstein-remote/**"
      - ".github/workflows/einstein-remote.yml"
  pull_request:
    paths:
      - "einstein-remote/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    name: Testes (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    defaults:
      run:
        working-directory: einstein-remote
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Dependências
        run: python -m pip install -r requirements-dev.txt
      - name: Testes (Linux, com tela virtual para a janela de pareamento)
        if: runner.os == 'Linux'
        run: xvfb-run -a python -m pytest -q
      - name: Testes (Windows — DPAPI, registro, Tk e bandeja reais)
        if: runner.os == 'Windows'
        run: python -m pytest -q

  windows-exe:
    name: Executável Windows
    needs: tests
    runs-on: windows-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: einstein-remote
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build (PyInstaller)
        shell: pwsh
        env:
          EINSTEIN_PYTHON: python
        run: ./installer/build-agent.ps1
      - name: Smoke test dos executáveis contra um servidor real
        run: |
          python -m pip install -r server/requirements.txt
          python installer/smoke_exe.py dist/EinsteinRemoteAgent
      - uses: actions/upload-artifact@v4
        with:
          name: EinsteinRemoteAgent-win64
          path: einstein-remote/dist/*.zip
          if-no-files-found: error
