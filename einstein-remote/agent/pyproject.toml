[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "einstein-remote-agent"
version = "0.3.0"
description = "EINSTEIN REMOTE AGENT - agente de monitoramento e controle remoto autorizado para Windows"
requires-python = ">=3.10"
dependencies = ["psutil>=5.9", "websockets>=13", "pystray>=0.19", "pillow>=10"]

[project.scripts]
einstein-agent = "einstein_agent.cli:main"

[tool.setuptools]
packages = ["einstein_agent"]
